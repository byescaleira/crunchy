name: Build and Attach Release Artifacts

# The server (cmd/crunchy) is pure Go / CGO-free — the embedded web UI is compiled
# in via go:embed, internal/browser uses modernc.org/sqlite (pure Go), and muxing
# shells out to ffmpeg at runtime. So the whole OS/arch matrix cross-compiles from
# a single Linux runner with CGO_ENABLED=0 — no native webview SDKs, no per-OS
# runners. Assets are named crunchy-<os>-<arch>[.exe] and match the install.sh /
# install.ps1 one-liners (releases/latest/download/<asset>).

on:
  release:
    types: [published]
  # Manual fallback: the `release: published` event is occasionally dropped on
  # repos with no prior Actions activity (GitHub's first-run gate). Dispatch by
  # hand with the tag to (re)build + attach the assets.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach assets to (e.g. 2.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build crunchy-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext="${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "crunchy-${GOOS}-${GOARCH}${ext}" ./cmd/crunchy

      - name: Stage asset
        shell: bash
        run: |
          ext="${{ matrix.ext }}"
          asset="crunchy-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"
          mkdir -p staging
          mv "$asset" "staging/$asset"
          echo "ASSET=staging/$asset" >> "$GITHUB_ENV"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # workflow_dispatch passes the tag in inputs.tag; the release event
          # carries it on github.event.release.tag_name. The || falls back so the
          # same step works under either trigger.
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" "$ASSET" --clobber